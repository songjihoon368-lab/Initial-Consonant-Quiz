<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스피드 초성 & OX 퀴즈 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
        }

        /* Custom smooth pulse animation for low timer warning */
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0.25); transform: scale(1); }
            50% { background-color: rgba(239, 68, 68, 0.5); transform: scale(1.04); }
        }
        .warning-active {
            animation: pulse-red 0.8s infinite;
        }

        /* Animated Sunset Ocean & Fog Waves */
        @keyframes oceanWave {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(8px) scaleY(1.05); }
        }
        @keyframes mistFloat {
            0% { transform: translateX(-10%); opacity: 0.25; }
            50% { transform: translateX(10%); opacity: 0.45; }
            100% { transform: translateX(-10%); opacity: 0.25; }
        }
        @keyframes sunGlow {
            0%, 100% { filter: drop-shadow(0 0 25px rgba(251, 146, 60, 0.8)); }
            50% { filter: drop-shadow(0 0 45px rgba(244, 63, 94, 0.9)); }
        }

        /* Animated Bird Flock Flying across sky */
        @keyframes birdFlyAcross {
            0% { transform: translate(-100px, 0px) scale(0.7); }
            50% { transform: translate(50vw, -20px) scale(0.85); }
            100% { transform: translate(calc(100vw + 100px), -10px) scale(0.7); }
        }
        @keyframes wingFlap {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(-0.3); }
        }

        .animate-ocean { animation: oceanWave 6s ease-in-out infinite; }
        .animate-mist { animation: mistFloat 18s ease-in-out infinite; }
        .animate-sun { animation: sunGlow 4s ease-in-out infinite; }
        
        .bird-flock {
            position: absolute;
            top: 15%;
            left: 0;
            width: 100%;
            height: 120px;
            pointer-events: none;
            animation: birdFlyAcross 22s linear infinite;
        }
        .bird-wing {
            transform-origin: center;
            animation: wingFlap 0.6s ease-in-out infinite;
        }

        /* Custom Fade Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 overflow-x-hidden relative">

    <!-- Sunset Beach Background Layers -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <!-- Sky Gradient: Sunset Glow -->
        <div class="absolute inset-0 bg-gradient-to-b from-indigo-950 via-purple-900 via-rose-900/90 to-amber-700/80"></div>

        <!-- Setting Sun -->
        <div class="absolute top-[38%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-44 h-44 sm:w-56 sm:h-56 bg-gradient-to-t from-amber-300 via-orange-400 to-rose-400 rounded-full animate-sun blur-[1px]"></div>

        <!-- Flying Birds Flock SVG -->
        <div class="bird-flock z-10 opacity-75">
            <svg viewBox="0 0 300 100" class="w-64 h-24">
                <path class="bird-wing" fill="none" stroke="#2a122e" stroke-width="3" stroke-linecap="round" d="M10,30 Q25,10 40,30 Q55,10 70,30" />

            </svg>
        </div>

        <!-- Misty Layer in Sky -->
        <div class="absolute top-0 left-0 w-[120%] h-3/5 bg-gradient-to-r from-purple-900/30 via-slate-200/20 to-rose-900/30 blur-2xl animate-mist"></div>

        <!-- Ocean & Waves -->
        <div class="absolute bottom-0 left-0 w-full h-[45%] bg-gradient-to-t from-slate-950 via-indigo-950/90 to-rose-950/70">
            <div class="w-32 sm:w-48 mx-auto h-full bg-gradient-to-b from-amber-400/30 via-rose-500/20 to-transparent blur-xl"></div>
            <svg class="absolute top-0 left-0 w-full h-24 text-rose-900/40 animate-ocean" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M0,0 C150,90 350,-40 500,50 C650,140 900,-20 1200,40 L1200,120 L0,120 Z" fill="currentColor"></path>
            </svg>
        </div>

        <!-- Beach Sandy Foreground Shoreline -->
        <div class="absolute bottom-0 left-0 w-full h-[18%] bg-gradient-to-t from-amber-950 via-slate-900 to-transparent opacity-90"></div>
    </div>

    <!-- Header Navigation -->
    <header class="w-full max-w-2xl mx-auto flex justify-between items-center py-3 px-4 bg-slate-900/80 backdrop-blur-md rounded-2xl shadow-2xl border border-amber-500/20 relative z-20">
        <!-- Timer Display (Top Left) -->
        <div id="timer-container" class="flex items-center space-x-2 bg-slate-950/90 px-4 py-2 rounded-xl border border-amber-500/30 transition-all duration-300">
            <span class="text-xs font-bold text-amber-200/70 uppercase tracking-wider">남은 시간</span>
            <span id="timer-display" class="text-2xl font-black text-emerald-400 font-mono w-14 text-center">30초</span>
        </div>

        <!-- Progress Counter -->
        <div class="text-right flex items-center space-x-2">
            <span id="chance-display" class="text-xs font-bold text-amber-300 bg-amber-950/80 px-3 py-1.5 rounded-full border border-amber-600/50">
                기회: 3번
            </span>
            <span id="progress-display" class="text-xs font-semibold text-rose-300 bg-rose-950/80 px-3 py-1.5 rounded-full border border-rose-700/50">
                문제 1 / 13
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-2xl mx-auto my-auto py-6 relative z-20">
        <!-- START SCREEN -->
        <div id="start-screen" class="bg-slate-900/85 backdrop-blur-md border border-amber-500/30 rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-orange-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-rose-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="inline-block p-4 bg-gradient-to-br from-amber-500/20 to-rose-500/20 rounded-2xl border border-amber-400/30 mb-6">

            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-white mb-3 tracking-tight">스피드 초성 & 퀴즈 게임!</h1>

                <strong class="text-amber-300">총 13개 문제</strong>가 준비되어 있습니다.<br>

                    </div>
                </div>

                    </div>

                    </p>
                </div>
            </div>

                        제출하기
                    </button>
                </form>

                <!-- 2. OX Buttons Type -->
                <div id="ox-container" class="hidden flex justify-center gap-6 py-2">

                        O

                        X
                    </button>
                </div>

                <!-- 3. Multiple Choice Options Type -->
                <div id="mc-container" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-3 py-1">
                    <!-- Buttons inserted dynamically by JS -->
                </div>
            </div>

            <!-- Retry/Feedback Mini Message -->
            <div id="feedback-toast" class="hidden text-center text-sm font-bold py-1 px-3 rounded-lg animate-fade-in my-1"></div>

            <div id="status-banner" class="hidden my-2 p-4 rounded-xl text-center font-bold text-lg border transition-all duration-300">

            </div>

            <!-- Explanation & Answer Display -->

                    <span>💡 정답 공개</span>
                </div>
                <p id="correct-answer-text" class="text-xl font-bold text-white"></p>
                <p id="explanation-detail" class="text-sm text-amber-100/80 leading-relaxed"></p>
            </div>

            <!-- Warning Banner for 5 Seconds Left -->
            <div id="warning-toast" class="hidden absolute top-4 left-1/2 transform -translate-x-1/2 bg-red-600/90 text-white px-5 py-2 rounded-full font-bold text-sm shadow-xl border border-red-400/50 flex items-center space-x-2 animate-bounce z-30">

                <span>남은 시간 5초! 서두르세요!</span>
            </div>

            <!-- Bottom Control Footer: "다음으로 넘어가기" button -->
            <div class="flex justify-end items-center pt-3 border-t border-amber-500/20 mt-auto">

            <div class="inline-block p-4 bg-amber-500/20 rounded-2xl border border-amber-400/30 mb-6">
                <span class="text-4xl">🏆</span>
            </div>
            <h2 class="text-3xl font-black text-white mb-2">퀴즈 종료!</h2>
            <p class="text-amber-100/80 text-sm mb-6">모든 13문제를 완료했습니다.</p>

            <div class="bg-slate-950 border border-amber-500/30 rounded-2xl p-6 mb-6 max-w-sm mx-auto">
                <p class="text-xs text-amber-400/70 uppercase tracking-wider mb-1 font-semibold">최종 점수</p>
                <div class="text-5xl font-black text-amber-400 my-2">
                    <span id="final-score">0</span> <span class="text-2xl text-slate-500">/ 13</span>
                </div>

                <p id="score-comment" class="text-sm font-medium text-amber-100 mt-2"></p>

            <!-- Leaderboard / 등수표 Section -->
            <div class="bg-slate-950/90 border border-amber-500/30 rounded-2xl p-5 mb-8 max-w-md mx-auto text-left shadow-inner">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                    <h3 class="text-base font-bold text-amber-300 flex items-center space-x-2">
                        <span>📊</span>
                        <span>실시간 명예의 전당 (Top 100)</span>
                    </h3>
                    <span class="text-xs text-slate-400">점수 / 걸린시간</span>
                </div>
                <ul id="leaderboard-list" class="space-y-2 text-sm max-h-64 overflow-y-auto pr-1 custom-scrollbar">
                    <!-- Dynamic Leaderboard Items inserted by JS -->
                </ul>
            </div>

            <button id="restart-btn" class="px-8 py-4 bg-gradient-to-r from-amber-500 to-rose-600 hover:from-amber-600 hover:to-rose-700 text-white font-bold text-lg rounded-2xl shadow-xl hover:shadow-amber-500/20 transition-all active:scale-95 border border-amber-300/40">
                다시 도전하기 🔄
            </button>
        </div>
    </main>

    <footer class="w-full text-center text-xs text-amber-200/60 py-2 relative z-20">
        중학생을 위한 바이브코딩 초성 퀴즈 프로젝트
    </footer>

                timeLimit: 35,
                maxChances: 3
            },
            {
                id: 9,
                type: "text",
                initials: "ㅍㅇㅆ",
                answer: "파이썬",
                hint: "💡 힌트: 배우기 쉽고 강력해서 세계적으로 많이 쓰이는 프로그래밍 언어",
                desc: "1991년 귀도 반 로섬이 발표한 고급 프로그래밍 언어로, 문법이 매우 간결합니다.<br>인공지능, 데이터 분석, 웹 개발 등 다양한 분야에서 세계적으로 가장 인기 있게 사용됩니다.",
                timeLimit: 35,
                maxChances: 3
            },
            {
                id: 10,
                type: "text",
                initials: "ㅎㄷㅂㅈ",
                answer: "한대부중",
                hint: "💡 힌트: 한양대학교 사범대학 부속중학교의 줄임말",
                desc: "한양대학교 사범대학 부속중학교를 약칭하여 부르는 명칭입니다.<br>학생들과 선생님들 사이에서 친숙하게 사용되는 학교의 줄임말 이름입니다.",
                timeLimit: 35,
                maxChances: 3
            },
            {
                id: 11,
                type: "ox",
                question: "이 제작자는 이 초성퀴즈를 만들면서 대여섯 번 틀렸다.",
                answer: "O",
                hint: "💡 힌트: O 또는 X를 선택하세요.",
                desc: "실제로 제작 과정에서 오타 및 규칙 검증을 하면서 5~6번 시행착오를 겪었습니다.<br>여러 번의 테스트와 오류 수정을 거친 끝에 완성도 높은 퀴즈 게임을 완성하게 되었습니다.",
                timeLimit: 20,
                maxChances: 1
            },
            {
                id: 12,
                type: "ox",
                question: "이 초성게임은 챗GPT로 만들었다.",
                answer: "X",
                hint: "💡 힌트: O 또는 X를 선택하세요.",
                desc: "이 게임은 챗GPT가 아닌 Google의 최신 AI 모델인 제미나이(Gemini)로 제작되었습니다.<br>제미나이의 뛰어난 코딩 능력을 바탕으로 신속하고 완성도 있게 구현되었습니다.",
                timeLimit: 20,
                maxChances: 1
            },
            {
                id: 13,
                type: "mc",
                question: "이 게임 개발자는 몇 번 만에 이 게임을 만들었을까?",
                options: ["1번: 1시간", "2번: 2시간", "3번: 3시간", "4번: 4시간", "5번: 5시간"],
                answer: "2번: 2시간",
                hint: "💡 힌트: 아래 보기 중 정답을 골라보세요.",
                desc: "개발자는 약 2시간 만에 전체 기획과 인터페이스, 로직 생성을 완료했습니다.<br>제미나이 AI와의 협업을 통해 단 2시간 만에 게임을 완벽하게 완성시켰습니다.",
                timeLimit: 30,
                maxChances: 2
            }
        ];

        // Game State Variables
        let currentQuizList = [];
        let currentIndex = 0;
        let score = 0;
        let timer = null;
        let timeLeft = 30;
        let remainingChances = 3;
        let isAnswered = false;

        // Total Elapsed Time Tracking Variables
        let totalStartTime = 0;
        let totalTimeTakenSeconds = 0;

        // Default Hall of Fame / Leaderboard Data (Top 100 Mock Data)
        const mockNames = [
            "초성신", "한대부중 짱", "스피드왕", "퀴즈마스터", "노력파", "열정맨", "빛의속도", "알락꼬리",
            "파이썬고수", "캔바전문가", "퀴즈천재", "바이브코더", "브레인", "속전속결", "어쩌다1등",
            "해 질 녘", "노을빛", "바다의왕", "달리는말", "초성달인", "정답탐정", "퀴즈요정", "번개손"
        ];

        let leaderboard = Array.from({ length: 99 }, (_, i) => {
            const nameIdx = i % mockNames.length;
            const rankNum = i + 1;
            // 점수는 13점부터 점차 감소, 시간은 35초부터 늘어남
            const calculatedScore = Math.max(1, 13 - Math.floor(i / 8));
            const calculatedTime = 35 + i * 2 + Math.floor(Math.random() * 5);

            return {
                name: `${rankNum}위 ${mockNames[nameIdx]}`,
                score: calculatedScore,
                time: calculatedTime
            };
        });

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const endScreen = document.getElementById('end-screen');

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');

        const quizForm = document.getElementById('quiz-form');
        const userAnswerInput = document.getElementById('user-answer');
        const oxContainer = document.getElementById('ox-container');
        const oxOBtn = document.getElementById('ox-o-btn');
        const oxXBtn = document.getElementById('ox-x-btn');
        const mcContainer = document.getElementById('mc-container');
        
        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer-display');
        const progressDisplay = document.getElementById('progress-display');
        const chanceDisplay = document.getElementById('chance-display');
        const quizTypeBadge = document.getElementById('quiz-type-badge');
        const questionText = document.getElementById('question-text');
        const questionHint = document.getElementById('question-hint');

        const feedbackToast = document.getElementById('feedback-toast');
        const statusBanner = document.getElementById('status-banner');
        const warningToast = document.getElementById('warning-toast');
        const explanationBox = document.getElementById('explanation-box');
        const correctAnswerText = document.getElementById('correct-answer-text');
        const explanationDetail = document.getElementById('explanation-detail');

        const finalScore = document.getElementById('final-score');
        const scoreComment = document.getElementById('score-comment');
        const timeTakenDisplay = document.getElementById('time-taken-display');
        const rankDisplay = document.getElementById('rank-display');
        const leaderboardList = document.getElementById('leaderboard-list');

        function normalizeText(str) {
            return str.replace(/\s+/g, '').toLowerCase();
        }

        function startGame() {
            currentQuizList = [...ALL_QUESTIONS];
            currentIndex = 0;
            score = 0;
            totalStartTime = Date.now(); // Start tracking total time

            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            clearInterval(timer);

            const currentQ = currentQuizList[currentIndex];
            timeLeft = currentQ.timeLimit;
            remainingChances = currentQ.maxChances;

            // UI Resets
            statusBanner.classList.add('hidden');
            statusBanner.className = "hidden my-2 p-4 rounded-xl text-center font-bold text-lg border transition-all duration-300";
            explanationBox.classList.add('hidden');
            nextBtn.classList.add('hidden');
            warningToast.classList.add('hidden');
            feedbackToast.classList.add('hidden');
            
            userAnswerInput.value = '';
            userAnswerInput.disabled = false;
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            timerContainer.classList.remove('warning-active', 'border-red-500');
            timerDisplay.classList.remove('text-red-400');
            timerDisplay.classList.add('text-emerald-400');
            timerDisplay.textContent = `${timeLeft}초`;

            progressDisplay.textContent = `문제 ${currentIndex + 1} / ${currentQuizList.length}`;
            chanceDisplay.textContent = `기회: ${remainingChances}번`;

            // Display question data according to type
            questionHint.textContent = currentQ.hint || "";

            if (currentQ.type === "text") {
                quizTypeBadge.textContent = "초성을 보고 정답을 맞춰보세요";
                questionText.textContent = currentQ.initials;
                quizForm.classList.remove('hidden');
                oxContainer.classList.add('hidden');
                mcContainer.classList.add('hidden');
                userAnswerInput.focus();
            } else if (currentQ.type === "ox") {
                quizTypeBadge.textContent = "OX 퀴즈! O 또는 X를 고르세요";
                questionText.textContent = currentQ.question;
                quizForm.classList.add('hidden');
                oxContainer.classList.remove('hidden');
                mcContainer.classList.add('hidden');
                oxOBtn.disabled = false;
                oxXBtn.disabled = false;
            } else if (currentQ.type === "mc") {
                quizTypeBadge.textContent = "객관식 퀴즈! 정답을 고르세요";
                questionText.textContent = currentQ.question;
                quizForm.classList.add('hidden');
                oxContainer.classList.add('hidden');
                mcContainer.classList.remove('hidden');
                
                // Build choices
                mcContainer.innerHTML = '';
                currentQ.options.forEach((opt) => {
                    const btn = document.createElement('button');
                    btn.className = 'mc-opt-btn w-full p-3.5 bg-slate-950 border border-amber-500/30 hover:border-amber-400 text-left font-semibold rounded-xl text-sm sm:text-base text-amber-100 hover:bg-amber-900/20 transition-all active:scale-95';
                    btn.textContent = opt;
                    btn.addEventListener('click', () => submitAnswer(opt));
                    mcContainer.appendChild(btn);
                });
            }

            startTimer();
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `${timeLeft}초`;

                if (timeLeft === 5) {
                    warningToast.classList.remove('hidden');
                    timerContainer.classList.add('warning-active', 'border-red-500');
                    timerDisplay.classList.remove('text-emerald-400');
                    timerDisplay.classList.add('text-red-400');
                }

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    warningToast.classList.add('hidden');
                    handleTimeOut();
                }
            }, 1000);
        }

        function submitAnswer(userAns) {
            if (isAnswered) return;

            const currentQ = currentQuizList[currentIndex];
            let isCorrect = false;

            if (currentQ.type === "text") {
                isCorrect = (normalizeText(userAns) === normalizeText(currentQ.answer));
            } else if (currentQ.type === "ox") {
                isCorrect = (userAns.toUpperCase() === currentQ.answer.toUpperCase());
            } else if (currentQ.type === "mc") {
                isCorrect = (userAns === currentQ.answer);
            }

            if (isCorrect) {
                score++;
                finishQuestion(true, false);
            } else {
                remainingChances--;
                chanceDisplay.textContent = `기회: ${remainingChances}번`;

                if (remainingChances > 0) {
                    // Show attempt feedback
                    feedbackToast.textContent = `❌ 오답입니다! 기회가 ${remainingChances}번 남았습니다. 다시 시도해보세요!`;
                    feedbackToast.className = "text-center text-sm font-bold py-1 px-3 rounded-lg animate-fade-in my-1 bg-red-900/60 text-rose-200 border border-red-500/40";
                    feedbackToast.classList.remove('hidden');
                    userAnswerInput.value = '';
                    userAnswerInput.focus();
                } else {
                    // Out of chances
                    finishQuestion(false, false);
                }
            }
        }

        function finishQuestion(isCorrect, isTimeout = false) {
            isAnswered = true;
            clearInterval(timer);

            // Disable controls
            userAnswerInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            oxOBtn.disabled = true;
            oxXBtn.disabled = true;
            document.querySelectorAll('.mc-opt-btn').forEach(btn => btn.disabled = true);
            
            warningToast.classList.add('hidden');
            feedbackToast.classList.add('hidden');

            const currentQ = currentQuizList[currentIndex];

            statusBanner.classList.remove('hidden');
            if (isTimeout) {
                statusBanner.textContent = "⏱️ 시간 초과! 정답을 확인해보세요.";
                statusBanner.classList.add('bg-amber-500/20', 'border-amber-500/40', 'text-amber-300');
            } else if (isCorrect) {
                statusBanner.textContent = "🎉 정답입니다! 참 잘했어요.";
                statusBanner.classList.add('bg-emerald-500/20', 'border-emerald-500/40', 'text-emerald-300');
            } else {
                statusBanner.textContent = "❌ 아쉽지만 실패했습니다!";
                statusBanner.classList.add('bg-red-500/20', 'border-red-500/40', 'text-red-300');
            }

            setTimeout(() => {
                statusBanner.classList.add('hidden');

                correctAnswerText.textContent = `정답: ${currentQ.answer}`;
                explanationDetail.textContent = currentQ.desc;
                explanationBox.classList.remove('hidden');

                nextBtn.classList.remove('hidden');
            }, 1800);
        }

        function handleTimeOut() {
            finishQuestion(false, true);
        }

        function handleNextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizList.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            // Calculate total time taken in seconds
            const totalEndTime = Date.now();
            totalTimeTakenSeconds = Math.floor((totalEndTime - totalStartTime) / 1000);

            quizScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');

            finalScore.textContent = score;

            // Display time taken
            const minutes = Math.floor(totalTimeTakenSeconds / 60);
            const seconds = totalTimeTakenSeconds % 60;
            const timeStr = minutes > 0 ? `${minutes}분 ${seconds}초` : `${seconds}초`;
            timeTakenDisplay.textContent = `⏱️ 총 소요 시간: ${timeStr}`;

            // Add Current User to Leaderboard
            const currentUserResult = {
                name: "나 (현재 기록)",
                score: score,
                time: totalTimeTakenSeconds,
                isCurrent: true
            };

            // Combine and Sort Leaderboard: Higher score first, then shorter time
            let combinedList = [...leaderboard, currentUserResult];
            combinedList.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.time - b.time;
            });

            // Keep top 100 rankings
            combinedList = combinedList.slice(0, 100);

            // Find current player rank
            const currentRankIndex = combinedList.findIndex(item => item.isCurrent);
            const userRank = currentRankIndex !== -1 ? currentRankIndex + 1 : "100+";

            // Update Rank Badge Message
            if (userRank === 1) {
                rankDisplay.textContent = `🏆 대단합니다! 축하합니다, 현재 1등입니다!`;
            } else if (userRank <= 100) {
                rankDisplay.textContent = `📊 전체 100명 중 ${userRank}위를 기록하셨습니다!`;
            } else {
                rankDisplay.textContent = `📊 아쉽게도 100위 권 외 기록입니다. 다시 도전해보세요!`;
            }

            if (score === currentQuizList.length) {
                scoreComment.textContent = "🥇 완벽해요! 모든 문항을 정답 처리했습니다!";
            } else if (score >= 9) {
                scoreComment.textContent = "🥈 참 잘했어요! 조금만 더 하면 1등 가능!";
            } else {
                scoreComment.textContent = "🥉 아쉽네요! 다시 시도해 상위권에 도전해보세요!";
            }

            // Render Leaderboard Items
            leaderboardList.innerHTML = '';
            combinedList.forEach((item, idx) => {
                const li = document.createElement('li');
                const rankNum = idx + 1;

                let rankBadge = `${rankNum}위`;
                if (rankNum === 1) rankBadge = '🥇 1위';
                else if (rankNum === 2) rankBadge = '🥈 2위';
                else if (rankNum === 3) rankBadge = '🥉 3위';

                const m = Math.floor(item.time / 60);
                const s = item.time % 60;
                const formattedTime = m > 0 ? `${m}분 ${s}초` : `${s}초`;

                li.className = `flex justify-between items-center p-2.5 rounded-xl border transition-all ${
                    item.isCurrent
                        ? 'bg-amber-500/20 border-amber-400 font-bold text-amber-200 ring-2 ring-amber-400/30'
                        : 'bg-slate-900 border-slate-800 text-slate-300'
                }`;

                li.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-black min-w-[42px]">${rankBadge}</span>
                        <span class="truncate max-w-[130px] sm:max-w-[180px]">${item.name}</span>
                    </div>
                    <div class="text-xs font-mono text-right">
                        <span class="text-amber-300 font-bold">${item.score}점</span>
                        <span class="text-slate-500 mx-1">|</span>
                        <span class="text-slate-400">${formattedTime}</span>
                    </div>
                `;
                leaderboardList.appendChild(li);
            });
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        quizForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = userAnswerInput.value.trim();
            if (!val) return;
            submitAnswer(val);
        });

        oxOBtn.addEventListener('click', () => submitAnswer('O'));
        oxXBtn.addEventListener('click', () => submitAnswer('X'));

        nextBtn.addEventListener('click', handleNextQuestion);
    </script>
</body>
</html>
