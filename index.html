<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초성 퀴즈 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
        }
        /* Custom smooth pulse animation for low timer warning */
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0.2); transform: scale(1); }
            50% { background-color: rgba(239, 68, 68, 0.4); transform: scale(1.05); }
        }
        .warning-active {
            animation: pulse-red 0.8s infinite;
        }

        /* Animated Sunset Ocean & Fog Waves */
        @keyframes oceanWave {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(8px) scaleY(1.05); }
        }
        @keyframes mistFloat {
            0% { transform: translateX(-10%); opacity: 0.25; }
            50% { transform: translateX(10%); opacity: 0.45; }
            100% { transform: translateX(-10%); opacity: 0.25; }
        }
        @keyframes sunGlow {
            0%, 100% { filter: drop-shadow(0 0 25px rgba(251, 146, 60, 0.8)); }
            50% { filter: drop-shadow(0 0 45px rgba(244, 63, 94, 0.9)); }
        }

        /* Animated Bird Flock Flying across sky */
        @keyframes birdFlyAcross {
            0% { transform: translate(-100px, 0px) scale(0.7); }
            50% { transform: translate(50vw, -20px) scale(0.85); }
            100% { transform: translate(calc(100vw + 100px), -10px) scale(0.7); }
        }
        @keyframes wingFlap {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(-0.3); }
        }

        .animate-ocean { animation: oceanWave 6s ease-in-out infinite; }
        .animate-mist { animation: mistFloat 18s ease-in-out infinite; }
        .animate-sun { animation: sunGlow 4s ease-in-out infinite; }
        
        .bird-flock {
            position: absolute;
            top: 15%;
            left: 0;
            width: 100%;
            height: 120px;
            pointer-events: none;
            animation: birdFlyAcross 22s linear infinite;
        }
        .bird-wing {
            transform-origin: center;
            animation: wingFlap 0.6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 overflow-x-hidden relative">

    <!-- Sunset Beach Background Layers -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <!-- Sky Gradient: Sunset Glow -->
        <div class="absolute inset-0 bg-gradient-to-b from-indigo-950 via-purple-900 via-rose-900/90 to-amber-700/80"></div>

        <!-- Setting Sun -->
        <div class="absolute top-[38%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-44 h-44 sm:w-56 sm:h-56 bg-gradient-to-t from-amber-300 via-orange-400 to-rose-400 rounded-full animate-sun blur-[1px]"></div>

        <!-- Flying Birds Flock SVG -->
        <div class="bird-flock z-10 opacity-75">
            <svg viewBox="0 0 300 100" class="w-64 h-24">
                <!-- Bird 1 -->
                <path class="bird-wing" fill="none" stroke="#2a122e" stroke-width="3" stroke-linecap="round" d="M10,30 Q25,10 40,30 Q55,10 70,30" />
                <!-- Bird 2 -->
                <path class="bird-wing" style="animation-delay: 0.15s" fill="none" stroke="#2a122e" stroke-width="2.5" stroke-linecap="round" d="M80,18 Q92,3 104,18 Q116,3 128,18" />
                <!-- Bird 3 -->
                <path class="bird-wing" style="animation-delay: 0.3s" fill="none" stroke="#2a122e" stroke-width="2" stroke-linecap="round" d="M135,42 Q145,30 155,42 Q165,30 175,42" />
                <!-- Bird 4 -->
                <path class="bird-wing" style="animation-delay: 0.45s" fill="none" stroke="#2a122e" stroke-width="2.5" stroke-linecap="round" d="M185,25 Q197,12 209,25 Q221,12 233,25" />
            </svg>
        </div>

        <!-- Misty Layer in Sky -->
        <div class="absolute top-0 left-0 w-[120%] h-3/5 bg-gradient-to-r from-purple-900/30 via-slate-200/20 to-rose-900/30 blur-2xl animate-mist"></div>

        <!-- Ocean & Waves -->
        <div class="absolute bottom-0 left-0 w-full h-[45%] bg-gradient-to-t from-slate-950 via-indigo-950/90 to-rose-950/70">
            <!-- Ocean Reflection -->
            <div class="w-32 sm:w-48 mx-auto h-full bg-gradient-to-b from-amber-400/30 via-rose-500/20 to-transparent blur-xl"></div>
            <!-- Waves SVG Overlay -->
            <svg class="absolute top-0 left-0 w-full h-24 text-rose-900/40 animate-ocean" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M0,0 C150,90 350,-40 500,50 C650,140 900,-20 1200,40 L1200,120 L0,120 Z" fill="currentColor"></path>
            </svg>
        </div>

        <!-- Beach Sandy Foreground Shoreline -->
        <div class="absolute bottom-0 left-0 w-full h-[18%] bg-gradient-to-t from-amber-950 via-slate-900 to-transparent opacity-90"></div>
    </div>

    <!-- UI Overlay Shell Container -->
    <header class="w-full max-w-2xl mx-auto flex justify-between items-center py-3 px-4 bg-slate-900/80 backdrop-blur-md rounded-2xl shadow-2xl border border-amber-500/20 relative z-20">
        <!-- Timer placed on Top Left as requested -->
        <div id="timer-container" class="flex items-center space-x-2 bg-slate-950/90 px-4 py-2 rounded-xl border border-amber-500/30 transition-all duration-300">
            <span class="text-xs font-bold text-amber-200/70 uppercase tracking-wider">남은 시간</span>
            <span id="timer-display" class="text-2xl font-black text-amber-400 font-mono w-12 text-center">20초</span>
        </div>

        <div class="text-right">
            <span id="progress-display" class="text-xs font-semibold text-rose-300 bg-rose-950/80 px-3 py-1.5 rounded-full border border-rose-700/50">
                문제 1 / 10
            </span>
        </div>
    </header>

    <main class="w-full max-w-2xl mx-auto my-auto py-6 relative z-20">
        <!-- START SCREEN -->
        <div id="start-screen" class="bg-slate-900/85 backdrop-blur-md border border-amber-500/30 rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-orange-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-rose-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="inline-block p-4 bg-gradient-to-br from-amber-500/20 to-rose-500/20 rounded-2xl border border-amber-400/30 mb-6">
                <span class="text-4xl">🌅</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-white mb-3">스피드 초성 퀴즈!</h1>
            <p class="text-amber-100/80 text-sm sm:text-base mb-8 leading-relaxed max-w-md mx-auto">
                <strong class="text-amber-300">총 10개 문제</strong>가 무작위로 섞여 출제됩니다.<br>
                문제당 <strong class="text-emerald-300">20초 제한시간</strong> 내에 정확한 정답을 맞춰보세요!
            </p>

            <button id="start-btn" class="w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-amber-500 via-rose-600 to-purple-600 hover:from-amber-600 hover:to-purple-700 text-white font-bold text-lg rounded-2xl shadow-xl hover:shadow-orange-500/30 transition-all transform active:scale-95 border border-amber-300/40">
                게임 시작하기 🚀
            </button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden bg-slate-900/85 backdrop-blur-md border border-amber-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl min-h-[420px] flex flex-col justify-between relative">
            
            <!-- Question Box -->
            <div class="space-y-4">
                <div class="flex items-center space-x-2 text-amber-200/80 text-sm font-medium">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span>초성을 보고 정답을 맞춰보세요</span>
                </div>
                
                <div class="bg-slate-950/80 border border-amber-500/20 rounded-2xl p-6 sm:p-8 text-center shadow-inner">
                    <p class="text-xs text-amber-400/70 uppercase tracking-wider mb-2 font-semibold">QUESTION</p>
                    <div id="question-text" class="text-2xl sm:text-4xl font-black tracking-widest text-amber-200 break-all leading-snug">
                        <!-- Initialized by JS -->
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div id="input-container" class="my-6 space-y-3">
                <form id="quiz-form" class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="user-answer" placeholder="정답을 입력하세요 (예: 사과)" autocomplete="off" class="flex-1 bg-slate-950 border border-amber-500/30 text-white placeholder-slate-400 px-5 py-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent text-lg font-medium transition-all">
                    <button type="submit" id="submit-btn" class="px-8 py-4 bg-gradient-to-r from-amber-600 to-rose-600 hover:from-amber-500 hover:to-rose-500 text-white font-bold rounded-xl shadow-lg transition-all active:scale-95 text-nowrap">
                        제출하기
                    </button>
                </form>
            </div>

            <!-- 2-Second Notification Overlay / Banner -->
            <div id="status-banner" class="hidden my-4 p-4 rounded-xl text-center font-bold text-lg border transition-all duration-300">
                <!-- Status displayed for 2s -->
            </div>

            <!-- Explanation & Answer Display (Revealed after submission or timeout) -->
            <div id="explanation-box" class="hidden bg-slate-950/90 border border-amber-500/30 rounded-2xl p-5 my-4 space-y-2 animate-fade-in">
                <div class="flex items-center space-x-2 text-amber-400 font-bold text-sm">
                    <span>💡 정답 공개</span>
                </div>
                <p id="correct-answer-text" class="text-xl font-bold text-white"></p>
                <p id="explanation-detail" class="text-sm text-amber-100/80 leading-relaxed"></p>
            </div>

            <!-- Warning Banner for 5 Seconds Left -->
            <div id="warning-toast" class="hidden absolute top-4 left-1/2 transform -translate-x-1/2 bg-red-600/90 text-white px-5 py-2 rounded-full font-bold text-sm shadow-xl border border-red-400/50 flex items-center space-x-2 animate-bounce">
                <span>⚠️</span>
                <span>남은 시간 5초! 서두르세요!</span>
            </div>

            <!-- Bottom Control Footer: "다음으로 넘어가기" button on bottom right -->
            <div class="flex justify-end items-center pt-4 border-t border-amber-500/20 mt-auto">
                <button id="next-btn" class="hidden px-6 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg hover:shadow-emerald-500/20 transition-all flex items-center space-x-2 active:scale-95">
                    <span>다음으로 넘어가기</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- END SCREEN -->
        <div id="end-screen" class="hidden bg-slate-900/85 backdrop-blur-md border border-amber-500/30 rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
            <div class="inline-block p-4 bg-amber-500/20 rounded-2xl border border-amber-400/30 mb-6">
                <span class="text-4xl">🏆</span>
            </div>
            <h2 class="text-3xl font-black text-white mb-2">퀴즈 종료!</h2>
            <p class="text-amber-100/80 text-sm mb-6">모든 10문제를 다 풀었습니다.</p>

            <div class="bg-slate-950 border border-amber-500/30 rounded-2xl p-6 mb-8 max-w-sm mx-auto">
                <p class="text-xs text-amber-400/70 uppercase tracking-wider mb-1 font-semibold">최종 점수</p>
                <div class="text-5xl font-black text-amber-400 my-2">
                    <span id="final-score">0</span> <span class="text-2xl text-slate-500">/ 10</span>
                </div>
                <p id="score-comment" class="text-sm font-medium text-amber-100 mt-2"></p>
            </div>

            <button id="restart-btn" class="px-8 py-4 bg-gradient-to-r from-amber-500 to-rose-600 hover:from-amber-600 hover:to-rose-700 text-white font-bold text-lg rounded-2xl shadow-xl hover:shadow-amber-500/20 transition-all active:scale-95 border border-amber-300/40">
                다시 도전하기 🔄
            </button>
        </div>
    </main>

    <footer class="w-full text-center text-xs text-amber-200/60 py-2 relative z-20">
        중학생을 위한 바이브코딩 초성 퀴즈 프로젝트
    </footer>

    <script>
        /*
         * Quiz Data Set (11 Questions provided by user)
         */
        const ALL_QUESTIONS = [
            {
                id: 1,
                initials: "ㅇㄹㄲㄹㅇㅇㅅㅇ",
                answer: "알락꼬리여우원숭이",
                desc: "마다가스카르 섬에 살며 줄무늬 꼬리가 특징인 유인원류 동물입니다."
            },
            {
                id: 2,
                initials: "ㅈㅇㅎㄸㅈㅂㅇㅍㄹㅂㅈㄴㅂ",
                answer: "작은홍띠점박이푸른부전나비",
                desc: "우리나라에 서식하는 나비목 부전나비과의 희귀한 나비 종류 중 하나입니다."
            },
            {
                id: 3,
                initials: "ㅅㄱ",
                answer: "사과",
                desc: "아삭아삭하고 달콤한 대표적인 과일입니다."
            },
            {
                id: 4,
                initials: "ㅂㄴㄴ",
                answer: "바나나",
                desc: "노란색 껍질 속에 부드럽고 달콤한 살이 들어있는 과일입니다."
            },
            {
                id: 5,
                initials: "ㅎㅇㄷㅎㄱㅅㅂㅂㅅㅈㅎㄱ",
                answer: "한양대학교사범대학부속중학교",
                desc: "서울특별시에 위치한 사립 중학교입니다."
            },
            {
                id: 6,
                initials: "ㅂㄱㅅㅇ ㅃㄷㄹㄴㅈ",
                answer: "벌거숭이 뻐드렁니쥐",
                desc: "통증을 잘 느끼지 못하고 통로를 파며 사는 신기한 땅속 포유류입니다."
            },
            {
                id: 7,
                initials: "ㅅㅈ",
                answer: "생쥐",
                desc: "몸집이 작은 잡식성 쥐과 동물입니다."
            },
            {
                id: 8,
                initials: "ㅋㅂ",
                answer: "캔바",
                desc: "디자인 포스터나 발표 자료를 쉽고 예쁘게 만들 수 있는 웹 플랫폼입니다."
            },
            {
                id: 9,
                initials: "ㅍㅇㅆ",
                answer: "파이썬",
                desc: "배우기 쉽고 강력해서 세계적으로 많이 쓰이는 프로그래밍 언어입니다."
            },
            {
                id: 10,
                initials: "ㅎㄷㅂㅈ",
                answer: "한대부중",
                desc: "한양대학교 사범대학 부속중학교의 줄임말입니다."
            }
        ];

        // Game Configuration
        const TOTAL_QUIZ_COUNT = 10;
        const TIME_LIMIT_PER_QUESTION = 20; // Seconds

        // Game State Variables
        let currentQuizList = [];
        let currentIndex = 0;
        let score = 0;
        let timer = null;
        let timeLeft = TIME_LIMIT_PER_QUESTION;
        let isSubmitted = false;

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const endScreen = document.getElementById('end-screen');

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');

        const quizForm = document.getElementById('quiz-form');
        const userAnswerInput = document.getElementById('user-answer');
        
        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer-display');
        const progressDisplay = document.getElementById('progress-display');
        const questionText = document.getElementById('question-text');

        const statusBanner = document.getElementById('status-banner');
        const warningToast = document.getElementById('warning-toast');
        const explanationBox = document.getElementById('explanation-box');
        const correctAnswerText = document.getElementById('correct-answer-text');
        const explanationDetail = document.getElementById('explanation-detail');

        const finalScore = document.getElementById('final-score');
        const scoreComment = document.getElementById('score-comment');

        // Helper: Shuffle array randomly (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Helper: Format string by removing spaces for flexible comparison
        function normalizeText(str) {
            return str.replace(/\s+/g, '').toLowerCase();
        }

        /*
         * Game Lifecycle Functions
         */
        function startGame() {
            // Select 10 random questions from total question list
            const shuffled = shuffleArray(ALL_QUESTIONS);
            currentQuizList = shuffled.slice(0, TOTAL_QUIZ_COUNT);
            
            currentIndex = 0;
            score = 0;

            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            // Reset UI state for new question
            isSubmitted = false;
            clearInterval(timer);
            timeLeft = TIME_LIMIT_PER_QUESTION;

            // UI Resets
            statusBanner.classList.add('hidden');
            statusBanner.className = "hidden my-4 p-4 rounded-xl text-center font-bold text-lg border transition-all duration-300";
            explanationBox.classList.add('hidden');
            nextBtn.classList.add('hidden');
            warningToast.classList.add('hidden');
            
            userAnswerInput.value = '';
            userAnswerInput.disabled = false;
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            timerContainer.classList.remove('warning-active', 'border-red-500');
            timerDisplay.classList.remove('text-red-400');
            timerDisplay.classList.add('text-emerald-400');
            timerDisplay.textContent = `${timeLeft}초`;

            // Load data into elements
            const currentQ = currentQuizList[currentIndex];
            questionText.textContent = currentQ.initials;
            progressDisplay.textContent = `문제 ${currentIndex + 1} / ${TOTAL_QUIZ_COUNT}`;

            userAnswerInput.focus();

            // Start Timer
            startTimer();
        }

        /*
         * Timer Handler (30s limit, warning at 5s, timeout triggers correct answer display)
         */
        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `${timeLeft}초`;

                // 5 seconds left notification
                if (timeLeft === 5) {
                    warningToast.classList.remove('hidden');
                    timerContainer.classList.add('warning-active', 'border-red-500');
                    timerDisplay.classList.remove('text-emerald-400');
                    timerDisplay.classList.add('text-red-400');
                }

                // Time Up
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    warningToast.classList.add('hidden');
                    handleTimeOut();
                }
            }, 1000);
        }

        /*
         * Process user submission or timeout
         */
        function processAnswer(userAns, isTimeout = false) {
            if (isSubmitted) return;
            isSubmitted = true;
            clearInterval(timer);

            const currentQ = currentQuizList[currentIndex];
            const isCorrect = !isTimeout && (normalizeText(userAns) === normalizeText(currentQ.answer));

            // Disable Inputs
            userAnswerInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            warningToast.classList.add('hidden');

            // 1. Show Status Notice (정답/오답 2초 공지)
            statusBanner.classList.remove('hidden');
            if (isTimeout) {
                statusBanner.textContent = "아쉽지만 다음기회에ㅠㅠ";
                statusBanner.classList.add('bg-amber-500/20', 'border-amber-500/40', 'text-amber-300');
            } else if (isCorrect) {
                score++;
                statusBanner.textContent = "참 잘했어요.";
                statusBanner.classList.add('bg-emerald-500/20', 'border-emerald-500/40', 'text-emerald-300');
            } else {
                statusBanner.textContent = "아쉽지만 다음기회에ㅠㅠ";
                statusBanner.classList.add('bg-red-500/20', 'border-red-500/40', 'text-red-300');
            }

            // 2. After 2 seconds, reveal full answer, details, and show "다음으로 넘어가기" button on bottom right
            setTimeout(() => {
                statusBanner.classList.add('hidden');

                // Show Correct Answer & Explanation
                correctAnswerText.textContent = `정답: ${currentQ.answer}`;
                explanationDetail.textContent = currentQ.desc;
                explanationBox.classList.remove('hidden');

                // Reveal bottom-right next button
                nextBtn.classList.remove('hidden');
            }, 2000);
        }

        function handleTimeOut() {
            processAnswer('', true);
        }

        function handleNextQuestion() {
            currentIndex++;
            if (currentIndex < TOTAL_QUIZ_COUNT) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            quizScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');

            finalScore.textContent = score;

            if (score === 10) {
                scoreComment.textContent = "🥇 대단해요! 완벽하게 모든 정답을 맞췄습니다!";
            } else if (score >= 7) {
                scoreComment.textContent = "🥈 참 잘했어요! 조금만 더 연습하면 만점도 가능해요!";
            } else {
                scoreComment.textContent = "🥉 아쉽네요! 한 번 더 도전해서 만점에 도전해보세요!";
            }
        }

        /*
         * Event Listeners
         */
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        quizForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = userAnswerInput.value.trim();
            if (!val) return;
            processAnswer(val, false);
        });

        nextBtn.addEventListener('click', handleNextQuestion);
    </script>
</body>
</html>
